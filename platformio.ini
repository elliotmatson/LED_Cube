; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Board envs only. `pio run` with no -e would otherwise also build
; [env:native], whose host compiler cannot build src/main.cpp (<Arduino.h>).
; Tests: `pio test -e native`.
default_envs = esp32-s3-devkitc-1

; Everything the board env needs. Not [env]: that would leak the framework,
; the ESP32 lib_deps and the IDF scripts into [env:native] as well.
[esp32_base]
; pioarduino 55.03.312-1 = Arduino 3.3.12 + ESP-IDF 5.5.5. Requires PlatformIO
; Core >= 6.2.0, which is why CI runs `pio-version: latest`. Hold off on the
; 61.x line (Arduino 4 / IDF 6) until ESP32-HUB75-MatrixPanel-DMA supports
; IDF 6 (mrcodetastic/ESP32-HUB75-MatrixPanel-DMA#865).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip ; 55.03.312-1
framework = espidf, arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
check_skip_packages = yes
; Network upload by default. A cube needs ArduinoOTA switched on in the
; dashboard first; comment these out to flash over USB (see README).
upload_protocol = espota
upload_port = cube.local
; save-defconfig, idf-size, size-components, size-files. Kept in step with the
; copy in hub and lp-p2p.
extra_scripts =
    scripts/idf_scripts.py
    scripts/size_guard.py
; arduino-esp32's component manifest pulls in RainMaker, Insights, Zigbee,
; speech recognition, Modbus and more, whether or not the sketch uses them.
; The cube uses none of them. Removing them shortens the build and drops the
; certificate workaround they needed (pioarduino issue #13).
custom_component_remove =
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diagnostics
    espressif/esp_diag_data_store
    espressif/qrcode
    espressif/esp-sr
    espressif/esp-zboss-lib
    espressif/esp-zigbee-lib
    espressif/esp-modbus
    espressif/esp_modem
    chmorgan/esp-libhelix-mp3
; Exact versions throughout: Dependabot has no PlatformIO ecosystem, so
; .github/workflows/dependency-updates.yml proposes bumps instead. Git
; dependencies pinned by commit carry a `; vX.Y.Z` comment so the updater can
; tell which release they are; the elliotmatson forks have no tags yet.
; ESP32-HUB75-MatrixPanel-DMA is the elliotmatson fork's row-writer branch:
; upstream 3.0.14+ plus drawRowRGB888(), which Canvas::push() uses. To go back
; to upstream once that lands there (or is dropped), restore mrcodetastic's
; URL and the per-pixel loop in Canvas::push().
lib_deps =
	adafruit/Adafruit GFX Library @ 1.12.6
	https://github.com/elliotmatson/ESP32-HUB75-MatrixPanel-DMA.git#0b3fbc3e9457aeba616f2bd40ce4b2579d4e0759 ; 3.0.14
	https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58 ; v2.0.17
	bblanchon/ArduinoJson @ 7.4.3
	ESP32Async/AsyncTCP @ 3.5.0
	ESP32Async/ESPAsyncWebServer @ 3.12.1
	https://github.com/elliotmatson/ESP-DASH-Pro.git#98e43812b1a100728e59164b5e89f89a1ac71124
	https://github.com/elliotmatson/TJpg_Decoder.git#afc091a723b5885030f79b5408541a7db6f5dae6
	https://github.com/elliotmatson/spotify-api-arduino-psram.git#0fbf554f2c371fb695f1d01186c96080c9598983
	adafruit/Adafruit NeoPixel @ 1.15.5

; V2 Hardware
[env:esp32-s3-devkitc-1]
extends = esp32_base
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs_s3.csv
board_upload.flash_size = 16MB
build_flags =
	-DCONFIG_ARDUHAL_LOG_COLORS=1
	; AsyncTCP's task (priority 10) on core 0 with WiFi, instead of either
	; core: on core 1 it starved the render task and the update screen
	; whenever the web server was busy, e.g. receiving a firmware upload.
	-DCONFIG_ASYNC_TCP_RUNNING_CORE=0

; Host unit tests for the hardware-independent libraries (lib/cube_geometry,
; lib/life). Only code those tests include is built; src/ is not.
[env:native]
platform = native
build_flags =
	-std=c++17
	-Wall
	-Wextra
