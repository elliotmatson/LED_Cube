# Thin caller for the shared firmware workflow. Toolchain setup, the PlatformIO
# pin, version macros, renaming, artifacts and releases all live in
# elliotmatson/pio-actions, so a fix lands once instead of being copied into
# each repo and drifting.
name: build-release

on:
  workflow_dispatch:
    inputs:
      release-type:
        type: choice
        description: Stable Release, Beta Release, or Build?
        options:
          - stable
          - beta
          - build
        default: build
      release-version:
        type: string
        description: Firmware Version (ignored for Build)
        default: "vX.X.X"
        required: true
  pull_request:

jobs:
  firmware:
    uses: elliotmatson/pio-actions/.github/workflows/build-release.yml@v1
    permissions:
      # write for the release job; the build jobs narrow themselves to read.
      contents: write
      # Lets the size diff post its comment on pull requests.
      pull-requests: write
    with:
      release-type: ${{ inputs.release-type || 'build' }}
      release-version: ${{ inputs.release-version || '' }}
      envs: default
      # pioarduino 55.03.312 requires PlatformIO Core >= 6.2.0; the shared
      # default is still pinned to 6.1.19 for repos on older platforms.
      pio-version: latest
      # Cubes running firmware from before the move to pio-actions update from
      # /releases/latest/download/esp32s3.bin, a name the shared workflow no
      # longer produces. Publishing the app image under the old name as well
      # lets them make the jump; newer firmware finds its image through the
      # releases API instead. Drop this once no cube runs the old updater.
      # Runs before the workflow stages dist/, which only adds to it.
      post-build-run: mkdir -p dist && cp -v ".pio/build/$PIO_ENV/firmware.bin" dist/esp32s3.bin
      # GitHub-hosted for now. Switching to a self-hosted runner is this one
      # line (a single label -- the input is a string).
      # runs-on: platformio
    secrets:
      # ESP-DASH-Pro is a private repository (its license forbids publishing
      # the source), so cloning it needs a token that can read it.
      gh-token: ${{ secrets.GH_PAT }}
